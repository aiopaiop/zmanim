services:
  - type: web
    name: prayer-ads
    runtime: docker
    plan: starter            # תוכנית בתשלום שלא נרדמת (חשוב לקו הטלפוני), בלי דיסק קבוע
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: IVR_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RECIPIENTS
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
